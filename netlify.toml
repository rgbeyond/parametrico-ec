[build]
  # `build:platform` va DESPUÉS de `build`: escribe dist/ec/, el build que monta
  # Beyond Platform (contrato de sesión v1); `build` vacía dist/ entero.
  command = "npm run build && npm run build:platform"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# El build que monta Beyond Platform vive en /ec/ y tiene su propio index.
[[redirects]]
  from = "/ec/*"
  to = "/ec/index.html"
  status = 200

# Aplicacion de una sola pagina: todo va al index
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
